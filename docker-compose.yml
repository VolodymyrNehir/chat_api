services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # inside the compose network the database is reachable by service name,
      # and the container always listens on 5432 internally regardless of the
      # host-side POSTGRES_PORT used to publish the db service
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${HOST_PORT:-${PORT}}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this alpine image resolves "localhost" to
      # ::1 first, and the app listens on 0.0.0.0 (IPv4 only), so
      # "localhost" would connection-refuse forever
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
